<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAABTA | Farewell 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Inknut+Antiqua:wght@300;500&family=Tenor+Sans&display=swap" rel="stylesheet">
    <style>
        :root {
            --marigold: #FF9933;
            --deep-saffron: #FF4500;
            --vintage-paper: #f4ece1;
            --henna-brown: #3d0c02;
            --gold-leaf: #D4AF37;
        }

        body {
            margin: 0;
            background-color: var(--vintage-paper);
            color: var(--henna-brown);
            font-family: 'Tenor Sans', sans-serif;
            overflow-x: hidden;
            background-image: url('https://www.transparenttextures.com/patterns/handmade-paper.png');
        }

        /* Desi Border Decorations */
        .mandala-corner {
            position: fixed;
            width: 150px;
            height: 150px;
            opacity: 0.15;
            z-index: 10;
            pointer-events: none;
            background-image: url('https://cdn-icons-png.flaticon.com/512/1043/1043444.png'); /* Mandala Icon */
            background-size: contain;
        }
        .top-left { top: -20px; left: -20px; }
        .top-right { top: -20px; right: -20px; transform: rotate(90deg); }

        /* Falling Marigolds */
        .genda-phool {
            position: fixed;
            top: -50px;
            font-size: 25px;
            z-index: 99;
            user-select: none;
            cursor: default;
            animation: fall linear infinite;
        }
        @keyframes fall {
            to { transform: translateY(110vh) rotate(360deg); }
        }

        /* Hero Section */
        header {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            border-bottom: 4px double var(--marigold);
        }

        .title-container {
            position: relative;
            padding: 40px;
            border: 1px solid rgba(61, 12, 2, 0.2);
        }

        .main-title {
            font-family: 'Pinyon Script', cursive;
            font-size: clamp(5rem, 15vw, 9rem);
            margin: 0;
            color: var(--henna-brown);
            line-height: 1;
        }

        .batch-tag {
            font-family: 'Inknut Antiqua', serif;
            letter-spacing: 5px;
            font-size: 0.9rem;
            margin-top: 10px;
        }

        /* Desi Countdown */
        .timer-box {
            background: rgba(255, 153, 51, 0.1);
            padding: 20px 40px;
            border-radius: 50px;
            border: 1px dashed var(--marigold);
            margin: 30px 0;
            display: flex;
            gap: 15px;
            font-family: 'Inknut Antiqua', serif;
        }

        /* Buttons */
        .btn-desi {
            background: var(--henna-brown);
            color: var(--vintage-paper);
            padding: 15px 35px;
            text-decoration: none;
            border: 2px solid var(--gold-leaf);
            font-weight: bold;
            letter-spacing: 2px;
            transition: 0.3s;
            box-shadow: 5px 5px 0px var(--marigold);
        }
        .btn-desi:hover {
            transform: translate(-2px, -2px);
            box-shadow: 8px 8px 0px var(--marigold);
        }

        /* Memory Roll - The Filmstrip */
        .memory-section {
            padding: 80px 0;
            background: #3d0c02; /* Henna/Dark wood background */
            color: var(--vintage-paper);
        }

        .memory-title {
            font-family: 'Pinyon Script', cursive;
            font-size: 4rem;
            color: var(--marigold);
        }

        .film-strip {
            display: flex;
            overflow-x: auto;
            gap: 30px;
            padding: 40px;
            scrollbar-width: none;
        }

        .polaroid {
            min-width: 260px;
            background: white;
            padding: 15px 15px 50px 15px;
            transform: rotate(-2deg);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .polaroid img { width: 100%; height: 250px; object-fit: cover; filter: sepia(0.2); }
        .polaroid p { color: #333; font-family: 'Pinyon Script', cursive; font-size: 1.8rem; margin: 10px 0 0 0; }

        /* The Quote */
        .desi-quote {
            padding: 100px 20px;
            font-style: italic;
            background-image: radial-gradient(circle, rgba(255,153,51,0.1) 0%, transparent 70%);
        }

        .desi-quote h2 {
            font-family: 'Inknut Antiqua', serif;
            font-size: 2rem;
            max-width: 800px;
            margin: 0 auto;
            line-height: 1.8;
        }

        /* Map & Playlist Grid */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            padding: 40px;
        }

        .desi-card {
            background: white;
            padding: 30px;
            border: 1px solid var(--marigold);
            border-radius: 2px;
            position: relative;
        }
        .desi-card::before {
            content: "✿";
            color: var(--marigold);
            position: absolute;
            top: 10px; left: 10px;
        }

        /* Music Toggle */
        #music-control {
            position: fixed;
            bottom: 30px; right: 30px;
            background: var(--marigold);
            width: 60px; height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center; justify-content: center;
            cursor: pointer;
            z-index: 100;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
            font-size: 24px;
        }

    </style>
</head>
<body>

    <div class="mandala-corner top-left"></div>
    <div class="mandala-corner top-right"></div>

    <div id="music-control" onclick="toggleMusic()">🎵</div>
    <audio id="raabtaAudio" loop>
        <source src="your-raabta-audio-link.mp3" type="audio/mpeg">
    </audio>

    <header>
        <div class="title-container">
            <h1 class="main-title">Raabta</h1>
            <div class="batch-tag">BATCH OF 2024 — 2026</div>
        </div>
        
        <p>12th January 2026 • 8:40 AM</p>

        <div class="timer-box" id="timer">
            </div>

        <a href="#" class="btn-desi">GRAB INVITATION CARD ↓</a>
    </header>

    <section class="desi-quote">
        <h2>"Kuch raaste khatam ho jaate hain,<br>par raabte hamesha rehte hain."</h2>
        <p style="margin-top: 20px; opacity: 0.7;">— Dedicated to the memories we made in these corridors.</p>
    </section>
     <section class="memory-section">
        <h2 class="memory-title">Memory Roll</h2>
        <div class="film-strip">
            <div class="polaroid"><img src="https://images.unsplash.com/photo-1528154291023-a6525fabe5b4?q=80" alt=""><p>Last Lunch</p></div>
            <div class="polaroid" style="transform: rotate(3deg);"><img src="https://images.unsplash.com/photo-1523240795612-9a054b0db644?q=80" alt=""><p>Exam Cries</p></div>
            <div class="polaroid" style="transform: rotate(-1deg);"><img src="https://images.unsplash.com/photo-1511632765486-a01980e01a18?q=80" alt=""><p>Squad Goals</p></div>
            <div class="polaroid" style="transform: rotate(2deg);"><img src="https://images.unsplash.com/photo-1491438590914-bc09fcaaf77a?q=80" alt=""><p>Farewell Vibe</p></div>
        </div>
    </section>

    <div class="grid-container">
        <div class="desi-card">
            <h3 style="font-family: 'Pinyon Script'; font-size: 2.5rem;">Venue Map</h3>
            <div style="width: 100%; height: 200px; background: #eee; border: 1px solid #ddd;">
                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3151.8354345093643!2d144.9537353153166!3d-37.81732767975171!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x6ad65d4c2b349649%3A0xb6899234e561db11!2sSchool!5e0!3m2!1sen!2sin!4v1610000000000!5m2!1sen!2sin" width="100%" height="100%" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
            </div>
        </div>
        <div class="desi-card">
            <h3 style="font-family: 'Pinyon Script'; font-size: 2.5rem;">Our Playlist</h3>
            <iframe style="border-radius:0px" src="https://open.spotify.com/embed/track/2SST9p869vMOfN4F9Kpx7l?utm_source=generator" width="100%" height="200" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
        </div>
    </div>

    <script>
        // Falling Marigolds
        function createFlower() {
            const flower = document.createElement('div');
            flower.className = 'genda-phool';
            flower.innerHTML = '✿'; 
            flower.style.left = Math.random() * 100 + 'vw';
            flower.style.animationDuration = Math.random() * 3 + 4 + 's';
            flower.style.color = Math.random() > 0.5 ? '#FF9933' : '#FFD700';
            document.body.appendChild(flower);
            setTimeout(() => flower.remove(), 6000);
        }
        setInterval(createFlower, 400);

        // Countdown Logic
        const farewellDate = new Date("January 12, 2026 11:30:00").getTime();
        setInterval(() => {
            const now = new Date().getTime();
            const diff = farewellDate - now;
            const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((diff % (1000 * 60)) / 1000);
            document.getElementById("timer").innerHTML = <span>${h}h</span> : <span>${m}m</span> : <span>${s}s</span>;
        }, 1000);
        // Music Toggle
        let playing = false;
        const audio = document.getElementById("raabtaAudio");
        function toggleMusic() {
            if(!playing) { audio.play(); document.getElementById("music-control").innerHTML = "⏸"; }
            else { audio.pause(); document.getElementById("music-control").innerHTML = "🎵"; }
            playing = !playing;
        }
    </script>
</body>
</html>
